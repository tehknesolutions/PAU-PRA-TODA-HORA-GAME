name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner alive
        run: echo "runner-ok"

  fighter-core:
    name: Fighter Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled Node
        run: node --version

      - name: Run fighter-core tests directly
        run: node --test packages/fighter-core/test/fighter-core.test.mjs
